name: Briefing diario

on:
  schedule:
    - cron: '0 13 * * 1-5' # 7am CDMX (UTC-6), lunes a viernes
  workflow_dispatch: {}

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Genera el briefing con Kimi (OpenRouter)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          SYSTEM_PROMPT='Eres el analista del bot de WhatsApp de Jonathan (academia-bot, ver CLAUDE.md).
          Revisa el estado del repo que te paso (prompts/, CLAUDE.md, bot.log si existe) y
          escribe un briefing diario con:
          - Fecha y hora del briefing
          - Qué tan al día está la config del bot (personas, few-shot, reglas)
          - Cualquier pendiente detectado (archivos desactualizados, TODOs, errores en bot.log)
          - Recordatorio de las reglas permanentes: nunca prometer precio, fecha o
            descuento sin aprobación de Jonathan, y ningún mensaje sale sin su revisión.
          Sé breve, directo y en tono cercano. Responde solo con el contenido del briefing en markdown.'

          CONTEXT=$(find prompts CLAUDE.md -type f -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \;)
          if [ -f bot.log ]; then
            CONTEXT="$CONTEXT
          --- bot.log ---
          $(cat bot.log)"
          fi

          BODY=$(jq -n --arg sys "$SYSTEM_PROMPT" --arg ctx "$CONTEXT" '{
            model: "moonshotai/kimi-k2",
            max_tokens: 800,
            messages: [
              {role: "system", content: $sys},
              {role: "user", content: $ctx}
            ]
          }')

          curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $KIMI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY" | jq -r '.choices[0].message.content' > briefing.md

          cat briefing.md

      - name: Commit y push del briefing
        run: |
          git config user.name "academia-bot"
          git config user.email "bot@academia-bot.local"
          git add briefing.md
          git diff --staged --quiet || git commit -m "briefing: actualización automática $(date -u +%Y-%m-%d)"
          git push
