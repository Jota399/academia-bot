name: Briefing diario

on:
  schedule:
    - cron: '0 13 * * 1-5' # 7am CDMX (UTC-6), lunes a viernes
  workflow_dispatch: {}

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala dependencias
        run: npm install

      - name: Genera el briefing (MCP de GitHub + Kimi) y abre PR
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: academia-bot
        run: node scripts/mcp-cron-agent.mjs
